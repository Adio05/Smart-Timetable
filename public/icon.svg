<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Calendar Card -->
  <rect x="96" y="104" width="320" height="304" rx="36" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Calendar Header -->
  <path d="M 96 140 C 96 120.1 112.1 104 132 104 L 380 104 C 399.9 104 416 120.1 416 140 L 416 188 L 96 188 Z" fill="#4338ca"/>
  
  <!-- Binder Rings -->
  <rect x="160" y="80" width="24" height="48" rx="12" fill="#e0e7ff"/>
  <rect x="328" y="80" width="24" height="48" rx="12" fill="#e0e7ff"/>
  
  <!-- Clock Circle inside calendar -->
  <circle cx="256" cy="296" r="82" fill="#f8fafc" stroke="#4f46e5" stroke-width="12"/>
  
  <!-- Clock ticks -->
  <line x1="256" y1="226" x2="256" y2="238" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <line x1="326" y1="296" x2="314" y2="296" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="366" x2="256" y2="354" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <line x1="186" y1="296" x2="198" y2="296" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Clock hands: 9:00 (one at 9, one at 12) -->
  <line x1="256" y1="296" x2="256" y2="242" stroke="#1e1b4b" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="296" x2="204" y2="296" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="296" r="7" fill="#4338ca"/>
  
  <!-- Active Schedule Badge -->
  <circle cx="376" cy="146" r="14" fill="#10b981"/>
</svg>
